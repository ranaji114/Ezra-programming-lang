name: CI · Build · Release
# Author: Ankur Rana
# Triggers:
#   - Every push/PR: quality gate + test
#   - git tag v*:    full cross-platform build + GitHub Release
#   - main branch:  docs deploy to GitHub Pages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

# ---------------------------------------------------------------------------
# Quality gate — runs on all 3 platforms for every push/PR
# ---------------------------------------------------------------------------
jobs:
  test:
    name: "Test · ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - run: cargo fmt -- --check
      - run: cargo clippy
      - run: cargo test --all

  # ---------------------------------------------------------------------------
  # Cross-platform binary builds (only on tag or main)
  # ---------------------------------------------------------------------------
  build:
    name: "Build · ${{ matrix.name }}"
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Windows ----
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ezra.exe
            lsp: ezra-lsp.exe
            archive: ezra-windows-x86_64-1.0.0.zip

          # ---- Linux x86_64 ----
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ezra
            lsp: ezra-lsp
            archive: ezra-linux-x86_64-1.0.0.tar.gz

          # ---- Linux ARM64 (cross-compile) ----
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: ezra
            lsp: ezra-lsp
            archive: ezra-linux-aarch64-1.0.0.tar.gz

          # ---- macOS x86_64 ----
          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            binary: ezra
            lsp: ezra-lsp
            archive: ezra-macos-x86_64-1.0.0.tar.gz

          # ---- macOS ARM64 (Apple Silicon) ----
          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: ezra
            lsp: ezra-lsp
            archive: ezra-macos-aarch64-1.0.0.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # ARM64 cross-compile toolchain
      - name: Install ARM64 linker (Linux cross)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu
        env:
          DEBIAN_FRONTEND: noninteractive

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      # ---- Windows: .zip ----
      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin   = "target/${{ matrix.target }}/release/${{ matrix.binary }}"
          $items = @($bin, "README.md", "examples", "std")
          $items = $items | Where-Object { Test-Path $_ }
          Compress-Archive -Path $items -DestinationPath "${{ matrix.archive }}" -Force

      # ---- Linux/macOS: .tar.gz ----
      - name: Package (tar.gz)
        if: runner.os != 'Windows'
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          LSP="target/${{ matrix.target }}/release/${{ matrix.lsp }}"
          EXTRAS=""
          [ -f "$LSP" ] && EXTRAS="$LSP"
          tar -czf "${{ matrix.archive }}" $BIN $EXTRAS README.md examples std

      # ---- Checksum ----
      - name: Generate SHA256
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi
          cat "${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  # ---------------------------------------------------------------------------
  # Debian package (.deb) — Linux x86_64 only
  # ---------------------------------------------------------------------------
  build-deb:
    name: "Build · debian package"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release

      - name: Build .deb
        working-directory: installers/linux
        run: |
          chmod +x build-deb.sh
          ./build-deb.sh 1.0.0 amd64

      - uses: actions/upload-artifact@v4
        with:
          name: ezra-lang_1.0.0_amd64.deb
          path: |
            installers/linux/ezra-lang_1.0.0_amd64.deb
            installers/linux/SHA256SUMS

  # ---------------------------------------------------------------------------
  # Windows Inno Setup installer (.exe)
  # ---------------------------------------------------------------------------
  build-inno:
    name: "Build · Windows installer (.exe)"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release

      # Download Inno Setup
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: iscc installers\windows\ezra-setup.iss

      - name: Checksum
        shell: bash
        run: sha256sum installers/windows/output/ezra-windows-x86_64-1.0.0.exe > installers/windows/output/ezra-windows-x86_64-1.0.0.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ezra-windows-x86_64-1.0.0-installer
          path: |
            installers/windows/output/ezra-windows-x86_64-1.0.0.exe
            installers/windows/output/ezra-windows-x86_64-1.0.0.exe.sha256

  # ---------------------------------------------------------------------------
  # VS Code extension (.vsix)
  # ---------------------------------------------------------------------------
  build-vsix:
    name: "Build · VS Code extension (.vsix)"
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension/flux
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/flux/package-lock.json

      - run: npm ci

      - name: Package VSIX
        run: npm run package

      - name: Rename and checksum
        id: vsix
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mv "ezra-lang-${VERSION}.vsix" "ezra-lang-${VERSION}-vscode.vsix"
          sha256sum "ezra-lang-${VERSION}-vscode.vsix" > "ezra-lang-${VERSION}-vscode.vsix.sha256"
          echo "vsix=ezra-lang-${VERSION}-vscode.vsix" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vsix.outputs.vsix }}
          path: |
            vscode-extension/flux/${{ steps.vsix.outputs.vsix }}
            vscode-extension/flux/${{ steps.vsix.outputs.vsix }}.sha256

  # ---------------------------------------------------------------------------
  # GitHub Pages docs deployment (main branch only)
  # ---------------------------------------------------------------------------
  deploy-docs:
    name: "Deploy · GitHub Pages"
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MkDocs Material
        run: pip install mkdocs-material mkdocs-minify-plugin

      - name: Build docs
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/

      - id: deploy
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # GitHub Release — assemble all artifacts and publish
  # ---------------------------------------------------------------------------
  release:
    name: "Release · GitHub"
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - build-deb
      - build-inno
      - build-vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine SHA256SUMS
        run: |
          cd dist
          find . -name "*.sha256" -exec cat {} \; | sort -k2 > SHA256SUMS
          echo "=== SHA256SUMS ===" && cat SHA256SUMS

      - name: Generate release notes
        id: notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cat > RELEASE_NOTES.md << EOF
          # Ezra ${TAG}

          **Created by Ankur Rana**
          **Docs:** https://ranaji114.github.io/Flux-programming-lang

          ---

          ## Install

          ### Windows (one-click installer)
          Download \`ezra-windows-x86_64-1.0.0.exe\` and run it.
          Or use the archive:
          \`\`\`powershell
          powershell -ExecutionPolicy Bypass -File install/install.ps1
          \`\`\`

          ### Linux (Debian/Ubuntu)
          \`\`\`bash
          sudo dpkg -i ezra-lang_1.0.0_amd64.deb
          \`\`\`
          Or via archive + install script:
          \`\`\`bash
          sh install/install.sh
          \`\`\`

          ### macOS
          \`\`\`bash
          sh install/install.sh
          \`\`\`

          ### VS Code Extension
          Install \`ezra-lang-1.0.0-vscode.vsix\` from VS Code → Extensions → ··· → Install from VSIX.

          ---

          ## Verify checksums
          \`\`\`
          $(cat dist/SHA256SUMS)
          \`\`\`

          ---
          *Test suite: 55/55 passing · Zero clippy warnings · Zero unsafe code*
          EOF
          echo "notes_written=true" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.exe
            dist/*.vsix
            dist/SHA256SUMS
