name: CI · Build · Release
# Author: Ankur Rana

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write

# ---------------------------------------------------------------------------
# Quality gate
# ---------------------------------------------------------------------------
jobs:
  test:
    name: "Test · ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
      - run: cargo fmt -- --check
        continue-on-error: true
      - run: cargo clippy
      - run: cargo test --all

  # ---------------------------------------------------------------------------
  # Cross-platform binary builds
  # ---------------------------------------------------------------------------
  build:
    name: "Build · ${{ matrix.name }}"
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            binary: ezra.exe
            archive: ezra-windows-x86_64-1.0.0.zip

          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: ezra
            archive: ezra-linux-x86_64-1.0.0.tar.gz

          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            binary: ezra
            archive: ezra-linux-aarch64-1.0.0.tar.gz

          - name: macos-x86_64
            os: macos-13
            target: x86_64-apple-darwin
            binary: ezra
            archive: ezra-macos-x86_64-1.0.0.tar.gz

          - name: macos-aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            binary: ezra
            archive: ezra-macos-aarch64-1.0.0.tar.gz

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install ARM64 cross-compiler
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc

      - name: Run tests (native only)
        if: matrix.target != 'aarch64-unknown-linux-gnu'
        run: cargo test --all

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $items = @(
            "target/${{ matrix.target }}/release/ezra.exe",
            "target/${{ matrix.target }}/release/ezra-lsp.exe",
            "README.md", "examples", "std", "install/install.ps1"
          )
          $existing = $items | Where-Object { Test-Path $_ }
          Compress-Archive -Path $existing -DestinationPath "${{ matrix.archive }}" -Force

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          BIN="target/${{ matrix.target }}/release/${{ matrix.binary }}"
          LSP="target/${{ matrix.target }}/release/ezra-lsp"
          EXTRA=""
          [ -f "$LSP" ] && EXTRA="$LSP"
          tar -czf "${{ matrix.archive }}" $BIN $EXTRA README.md examples std install/install.sh

      - name: SHA256
        shell: bash
        run: |
          if command -v sha256sum &>/dev/null; then
            sha256sum "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          else
            shasum -a 256 "${{ matrix.archive }}" > "${{ matrix.archive }}.sha256"
          fi
          cat "${{ matrix.archive }}.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            ${{ matrix.archive }}
            ${{ matrix.archive }}.sha256

  # ---------------------------------------------------------------------------
  # Windows GUI Installer (.exe) — using ps2exe on Windows runner
  # ---------------------------------------------------------------------------
  build-windows-installer:
    name: "Build · Windows GUI Installer (.exe)"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Build GUI installer EXE with ps2exe
        shell: pwsh
        run: |
          Install-Module -Name ps2exe -Scope CurrentUser -Force -AllowClobber
          Import-Module ps2exe -Force
          $in  = "installers\windows\ezra-installer-gui.ps1"
          $out = "installers\windows\EzraSetup-1.0.0.exe"
          Invoke-ps2exe `
            -inputFile  $in `
            -outputFile $out `
            -title      "Ezra Language Setup" `
            -description "Ezra Language 1.0.0 Installer by Ankur Rana" `
            -company    "Ankur Rana" `
            -product    "Ezra Language" `
            -version    "1.0.0.0" `
            -noConsole
          $size = [math]::Round((Get-Item $out).Length/1KB)
          Write-Host "EXE: $out ($size KB)"

      - name: SHA256
        shell: pwsh
        run: |
          $hash = (Get-FileHash "installers\windows\EzraSetup-1.0.0.exe" -Algorithm SHA256).Hash.ToLower()
          "$hash  EzraSetup-1.0.0.exe" | Set-Content "installers\windows\EzraSetup-1.0.0.exe.sha256"
          Write-Host $hash

      - uses: actions/upload-artifact@v4
        with:
          name: EzraSetup-1.0.0.exe
          path: |
            installers/windows/EzraSetup-1.0.0.exe
            installers/windows/EzraSetup-1.0.0.exe.sha256

  # ---------------------------------------------------------------------------
  # Linux .deb package
  # ---------------------------------------------------------------------------
  build-deb:
    name: "Build · Linux .deb installer"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - run: cargo build --release

      - name: Build .deb
        run: |
          VERSION="1.0.0"
          ARCH="amd64"
          PKG="ezra-lang_${VERSION}_${ARCH}"
          BINARY="target/release/ezra"
          LSP="target/release/ezra-lsp"

          mkdir -p ${PKG}/DEBIAN
          mkdir -p ${PKG}/usr/bin
          mkdir -p ${PKG}/usr/share/ezra/examples
          mkdir -p ${PKG}/usr/share/ezra/std
          mkdir -p ${PKG}/usr/share/doc/ezra-lang
          mkdir -p ${PKG}/usr/share/man/man1

          install -m755 $BINARY ${PKG}/usr/bin/ezra
          [ -f $LSP ] && install -m755 $LSP ${PKG}/usr/bin/ezra-lsp
          cp -r examples/. ${PKG}/usr/share/ezra/examples/
          cp -r std/.      ${PKG}/usr/share/ezra/std/
          cp README.md     ${PKG}/usr/share/doc/ezra-lang/
          cp LICENSE       ${PKG}/usr/share/doc/ezra-lang/copyright

          cat > ${PKG}/usr/share/man/man1/ezra.1 << 'MAN'
          .TH EZRA 1 "2026" "1.0.0" "Ezra Language"
          .SH NAME
          ezra \- Ezra scripting language interpreter
          .SH SYNOPSIS
          .B ezra
          [\fICOMMAND\fR] [\fIFILE\fR]
          .SH DESCRIPTION
          Ezra is a readable scripting language built in Rust. Created by Ankur Rana.
          .SH COMMANDS
          run, check, test, fmt, lint, build, repl, new, --version
          .SH AUTHOR
          Ankur Rana <https://github.com/ranaji114>
          MAN
          gzip -9 ${PKG}/usr/share/man/man1/ezra.1

          INSTALLED=$(du -sk ${PKG} | cut -f1)
          cat > ${PKG}/DEBIAN/control << EOF
          Package: ezra-lang
          Version: $VERSION
          Section: devel
          Priority: optional
          Architecture: $ARCH
          Installed-Size: $INSTALLED
          Maintainer: Ankur Rana <ankur@ranaji114.github.io>
          Homepage: https://ranaji114.github.io/Flux-programming-lang
          Description: Ezra scripting language interpreter
           Readable, indentation-based scripting language built in Rust.
           Created by Ankur Rana.
          EOF

          cat > ${PKG}/DEBIAN/postinst << 'SCRIPT'
          #!/bin/sh
          echo "Ezra 1.0.0 installed! Run: ezra --version"
          SCRIPT
          chmod 755 ${PKG}/DEBIAN/postinst

          dpkg-deb --build --root-owner-group ${PKG}
          sha256sum ${PKG}.deb > ${PKG}.deb.sha256
          echo "Built: ${PKG}.deb"
          cat ${PKG}.deb.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ezra-lang_1.0.0_amd64.deb
          path: |
            ezra-lang_1.0.0_amd64.deb
            ezra-lang_1.0.0_amd64.deb.sha256

  # ---------------------------------------------------------------------------
  # macOS .pkg installer
  # ---------------------------------------------------------------------------
  build-macos-pkg:
    name: "Build · macOS .pkg installer (${{ matrix.arch }})"
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            os: macos-13
            target: x86_64-apple-darwin
            pkg: ezra-macos-x86_64-1.0.0.pkg
          - arch: aarch64
            os: macos-latest
            target: aarch64-apple-darwin
            pkg: ezra-macos-aarch64-1.0.0.pkg

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: cargo build --release --target ${{ matrix.target }}

      - name: Build .pkg
        run: |
          BIN="target/${{ matrix.target }}/release/ezra"
          LSP="target/${{ matrix.target }}/release/ezra-lsp"
          PAYLOAD="_payload_${{ matrix.arch }}"
          SCRIPTS="_scripts_${{ matrix.arch }}"

          mkdir -p ${PAYLOAD}/usr/local/bin
          mkdir -p ${PAYLOAD}/usr/local/share/ezra/examples
          mkdir -p ${PAYLOAD}/usr/local/share/ezra/std
          mkdir -p ${PAYLOAD}/usr/local/share/doc/ezra
          mkdir -p ${SCRIPTS}

          install -m755 $BIN ${PAYLOAD}/usr/local/bin/ezra
          [ -f $LSP ] && install -m755 $LSP ${PAYLOAD}/usr/local/bin/ezra-lsp
          cp -r examples/. ${PAYLOAD}/usr/local/share/ezra/examples/
          cp -r std/.      ${PAYLOAD}/usr/local/share/ezra/std/
          cp README.md     ${PAYLOAD}/usr/local/share/doc/ezra/
          cp LICENSE       ${PAYLOAD}/usr/local/share/doc/ezra/

          cat > ${SCRIPTS}/postinstall << 'SCRIPT'
          #!/bin/sh
          # Add to PATH in shell profiles
          for RCFILE in "$HOME/.zshrc" "$HOME/.bashrc" "$HOME/.bash_profile"; do
            if [ -f "$RCFILE" ] && ! grep -q "ezra" "$RCFILE"; then
              echo 'export PATH="/usr/local/bin:$PATH"' >> "$RCFILE"
            fi
          done
          echo "Ezra 1.0.0 installed!"
          echo "Run: ezra --version"
          SCRIPT
          chmod 755 ${SCRIPTS}/postinstall

          pkgbuild \
            --root ${PAYLOAD} \
            --scripts ${SCRIPTS} \
            --identifier "io.github.ranaji114.ezra" \
            --version "1.0.0" \
            --install-location "/" \
            "${{ matrix.pkg }}"

          shasum -a 256 "${{ matrix.pkg }}" > "${{ matrix.pkg }}.sha256"
          echo "Built: ${{ matrix.pkg }}"
          cat "${{ matrix.pkg }}.sha256"
          rm -rf ${PAYLOAD} ${SCRIPTS}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.pkg }}
          path: |
            ${{ matrix.pkg }}
            ${{ matrix.pkg }}.sha256

  # ---------------------------------------------------------------------------
  # VS Code Extension VSIX
  # ---------------------------------------------------------------------------
  build-vsix:
    name: "Build · VS Code Extension (.vsix)"
    needs: test
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vscode-extension/flux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-extension/flux/package-lock.json
      - run: npm ci
      - run: npm run package
      - name: Rename and checksum
        id: vsix
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mv "ezra-lang-${VERSION}.vsix" "ezra-lang-${VERSION}-vscode.vsix"
          sha256sum "ezra-lang-${VERSION}-vscode.vsix" > "ezra-lang-${VERSION}-vscode.vsix.sha256"
          echo "vsix=ezra-lang-${VERSION}-vscode.vsix" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vsix.outputs.vsix }}
          path: |
            vscode-extension/flux/${{ steps.vsix.outputs.vsix }}
            vscode-extension/flux/${{ steps.vsix.outputs.vsix }}.sha256

  # ---------------------------------------------------------------------------
  # GitHub Pages docs
  # ---------------------------------------------------------------------------
  deploy-docs:
    name: "Deploy · GitHub Pages"
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material mkdocs-minify-plugin
      - run: mkdocs build --strict
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/
      - id: deploy
        uses: actions/deploy-pages@v4

  # ---------------------------------------------------------------------------
  # GitHub Release — publish all artifacts
  # ---------------------------------------------------------------------------
  release:
    name: "Release · GitHub"
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - build-windows-installer
      - build-deb
      - build-macos-pkg
      - build-vsix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Combine SHA256SUMS
        run: |
          cd dist
          find . -name "*.sha256" -exec cat {} \; | sort -k2 > SHA256SUMS
          echo "=== SHA256SUMS ===" && cat SHA256SUMS

      - name: Release notes
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          cat > RELEASE_NOTES.md << 'EOF'
          ## Ezra Language — Production Release

          **Created by Ankur Rana**

          ---

          ## Windows Install

          ### Option 1 — GUI Installer (recommended, Python-style)
          Download **`EzraSetup-1.0.0.exe`** and double-click it.
          - Graphical wizard with install directory picker
          - Automatically adds `ezra` to PATH
          - Optional VS Code extension download

          ### Option 2 — Command line
          ```powershell
          powershell -ExecutionPolicy Bypass -File install\install.ps1
          ```

          ---

          ## Linux Install

          ### Debian/Ubuntu (.deb)
          ```bash
          sudo dpkg -i ezra-lang_1.0.0_amd64.deb
          ezra --version
          ```

          ### Other Linux (tar.gz)
          ```bash
          sh install/install.sh
          ```

          ---

          ## macOS Install

          ### Option 1 — .pkg installer (double-click)
          Download `ezra-macos-aarch64-1.0.0.pkg` (Apple Silicon) or
          `ezra-macos-x86_64-1.0.0.pkg` (Intel) and double-click.

          ### Option 2 — Script
          ```bash
          sh install/install.sh
          ```

          ---

          ## VS Code Extension
          1. Download `ezra-lang-1.0.0-vscode.vsix`
          2. VS Code → Extensions → `···` → Install from VSIX
          3. Open any `.ez` file — syntax highlighting works!
          4. Press `Ctrl+R` to run

          ---

          ## Quick Start (after install)
          ```
          ezra --version
          ezra new my_app
          cd my_app
          ezra run
          ```

          Docs: https://ranaji114.github.io/Flux-programming-lang
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.deb
            dist/*.pkg
            dist/*.exe
            dist/*.vsix
            dist/SHA256SUMS
