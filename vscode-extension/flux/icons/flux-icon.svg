<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF8C00;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF4500;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFE0A0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.5" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="128" height="128" rx="22" ry="22" fill="url(#bgGrad)" />

  <!-- Subtle inner glow border -->
  <rect width="128" height="128" rx="22" ry="22" fill="none"
        stroke="rgba(255,255,255,0.15)" stroke-width="2" />

  <!-- Flow lines (3 horizontal lines with rightward taper — flux/flow symbol) -->
  <!-- Top line -->
  <line x1="22" y1="42" x2="82" y2="42"
        stroke="white" stroke-width="7" stroke-linecap="round"
        opacity="0.6" filter="url(#glow)" />

  <!-- Middle line (full, brightest) -->
  <line x1="22" y1="64" x2="95" y2="64"
        stroke="white" stroke-width="9" stroke-linecap="round"
        opacity="1" filter="url(#glow)" />

  <!-- Bottom line -->
  <line x1="22" y1="86" x2="82" y2="86"
        stroke="white" stroke-width="7" stroke-linecap="round"
        opacity="0.6" filter="url(#glow)" />

  <!-- Arrow head pointing right on center line -->
  <polygon points="91,55  109,64  91,73"
           fill="white" filter="url(#glow)" />

</svg>
